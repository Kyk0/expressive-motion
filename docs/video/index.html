<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch the Robot Walk</title>
<meta name="description" content="A Booster K1 humanoid walking a runway with a catwalk policy learned from one monocular video.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Expressive Humanoid Locomotion — video">
<meta property="og:image" content="https://kyk0.github.io/expressive-motion/assets/og.jpg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #ececef; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; max-height: calc(100dvh - 7rem); background: #000; display: block; }
  footer { padding: 1rem 16px 1.5rem; text-align: center; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem; }
  nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  a {
    color: #ececef; text-decoration: none; font-weight: 600; font-size: 0.9rem;
    border: 1px solid #3a3c42; border-radius: 999px; padding: 0.45rem 0.95rem;
  }
  a:hover { background: #1c1d21; }
  a.primary { background: #ececef; color: #000; border-color: #ececef; }
</style>
</head>
<body>

<main>
  <video src="demo.mp4" poster="poster.jpg" autoplay muted loop playsinline controls>
    <a href="demo.mp4">Download the video</a>
  </video>
</main>

<footer>
  <h1>Learning Expressive Humanoid Locomotion from Monocular Runway Videos</h1>
  <nav>
    <a class="primary" href="../">Project page</a>
    <a href="https://github.com/Kyk0/expressive-motion">Code</a>
    <a href="expressive-motion_poster.pdf">Poster</a>
  </nav>
</footer>

</body>
</html>
